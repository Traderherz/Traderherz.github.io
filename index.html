<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traderherz Research</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#07111f;--bg2:#101722;--card:#0f1b2d;--border:#1c2a3d;
--text:#fff;--muted:#aab5c5;--accent:#00e5c3;
}
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
body{font-family:Inter,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
.container{max-width:1280px;margin:auto;padding:0 24px}
nav{position:sticky;top:0;background:rgba(7,17,31,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:999}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.logo{width:45px;height:45px;} 
.links{display:flex;gap:24px;align-items:center}
.links a{color:#fff;text-decoration:none}
select{background:#0f1b2d;color:#fff;border:1px solid var(--border);padding:8px;border-radius:8px}
.hamburger{display:none;cursor:pointer;font-size:28px}
.hero{padding:90px 0}
.badge{display:inline-block;padding:8px 14px;border:1px solid rgba(0,229,195,.4);border-radius:999px;color:var(--accent);margin-bottom:18px}
h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1.05}
h2{color:var(--accent);margin:14px 0}
.lead{max-width:900px;color:var(--muted);margin:20px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.card img{width:100%;height:170px;object-fit:cover}
.card-content{padding:20px}
.card p{color:var(--muted)}
footer{border-top:1px solid var(--border);margin-top:80px;padding:40px 0}
.footer-links{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.risk{margin-top:40px;padding:24px;background:#08101c;border:1px solid var(--border);border-radius:14px;color:var(--muted)}
.cta-wrap{text-align:center;margin-top:52px}
.cta-btn{
display:inline-flex;align-items:center;gap:12px;
padding:20px 42px;
background:linear-gradient(135deg,var(--accent),#00b8a0);
color:#07111f;font-family:Inter,sans-serif;font-weight:700;font-size:1.05rem;
border:none;border-radius:14px;cursor:pointer;text-decoration:none;
box-shadow:0 0 32px rgba(0,229,195,.28),0 4px 24px rgba(0,0,0,.35);
transition:transform .2s,box-shadow .2s;
letter-spacing:.01em;
}
.cta-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 52px rgba(0,229,195,.45),0 8px 32px rgba(0,0,0,.4)}
.cta-btn svg{flex-shrink:0}
.cookie{position:fixed;bottom:20px;left:20px;right:20px;background:#0d1727;padding:18px;border:1px solid var(--border);border-radius:12px;display:none;z-index:1000}
.cookie button{margin-left:10px;padding:8px 12px}
@media(max-width:900px){
.links{display:none;position:absolute;top:75px;left:0;right:0;background:#07111f;flex-direction:column;padding:20px}
.links.show{display:flex}
.hamburger{display:block}
}
</style>
</head>
<body>

<nav>
<div class="container nav">
<div class="brand">
<img class="logo" src="TraderherzLogo.png" alt="Logo">
<span>Traderherz Research</span>
</div>

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div class="links" id="menu">
<a href="#research">Research</a>
<a href="#briefing">Briefing</a>
<a href="https://traderherz.github.io/demo.html">Demo</a>
<a href="#broker">Broker</a>
<a href="#kontakt">Kontakt</a>
<select id="lang" onchange="setLang(this.value)">
<option value="de">DE</option>
<option value="en">EN</option>
<option value="es">ES</option>
</select>
</div>
</div>
</nav>

<section class="hero container" id="research">
<div class="badge" data-i18n="badge"></div>
<h1 data-i18n="h1"></h1>
<h2 data-i18n="h2"></h2>
<p class="lead" data-i18n="lead"></p>

<div class="grid">
<div class="card">
<img src="scenario-analysis.jpg" alt="Scenario Analysis">
<div class="card-content">
<h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p>
</div></div>

<div class="card">
<img src="macro-catalysts.jpg" alt="Macro Catalysts">
<div class="card-content">
<h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p>
</div></div>

<div class="card">
<img src="liquidity-levels.jpg" alt="Liquidity Levels">
<div class="card-content">
<h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p>
</div></div>

<div class="card">
<img src="risk-management.jpg" alt="Risk Management">
<div class="card-content">
<h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p>
</div></div>
</div>

<div class="cta-wrap">
  <a href="#briefing" class="cta-btn" data-i18n-href="ctahref">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <span data-i18n="cta"></span>
  </a>
</div>

</section>

<footer class="container" id="kontakt">
<p data-i18n="copyright"></p>
<div class="footer-links">
<span data-i18n="imprint"></span>
<span data-i18n="privacy"></span>
<span data-i18n="risklink"></span>
</div>

<div class="risk">
<h3 data-i18n="risktitle"></h3>
<p data-i18n="risktext"></p>
</div>
</footer>

<div class="cookie" id="cookieBox">
<span data-i18n="cookie"></span>
<button onclick="acceptCookies()">OK</button>
</div>

<script>
function toggleMenu(){document.getElementById('menu').classList.toggle('show')}
const txt={
de:{

f1t:"Validierte Wochen-Szenarien",f1d:"Vordefinierte mathematische Pfade mit exakten Eintrittswahrscheinlichkeiten.",
f2t:"Fundamentale Impulsgeber",f2d:"Core PCE, GDP und geopolitische Wildcards im Fokus.",

imprint:"Impressum",privacy:"Datenschutzerklärung",risklink:"Risikohinweis",

risktext:"Investieren ist spekulativ. 60% - 85% der privaten Trading Konten verlieren Geld beim Handel. Riskieren Sie nur Kapital, dessen Verlust Sie tragen können. Diese Webseite ist keine Anlageberatung. Traderherz führt keine Anlageberatung durch und verwaltet keine Kundengelder.",

},
en:{
badge:"Every Sunday before market open",
h1:"Weekly SP500 Sunday Briefing",
h2:"Trade Like an Institution. Not a Retail Trader.",
lead:"Your institutional-grade S&P 500 roadmap every Sunday before the market opens.",
f1t:"Validated Weekly Scenarios",f1d:"Predefined mathematical paths with quantified probabilities.",
f2t:"Macro Catalysts",f2d:"Core PCE, GDP and geopolitical wildcards.",
f3t:"Institutional Key Levels",f3d:"Demand zones, swing lows and distribution areas.",

copyright:"© 2026 Copyright Traderherz.com - All rights reserved.",
imprint:"Legal Notice",privacy:"Privacy Policy",risklink:"Risk Disclaimer",

badge:"Cada domingo antes de la apertura",

h2:"Opera como una institución. No como un minorista.",

f1t:"Escenarios Validados",f1d:"Rutas matemáticas con probabilidades definidas.",
f2t:"Catalizadores Macro",f2d:"Eventos económicos y factores geopolíticos clave.",

}};

function setLang(l){
localStorage.lang=l;
document.getElementById("lang").value=l;
document.querySelectorAll("[data-i18n]").forEach(e=>e.innerText=txt[l][e.dataset.i18n]);
}
let lang=(localStorage.lang||navigator.language.slice(0,2));
if(!txt[lang]) lang="de";
setLang(lang);

if(!localStorage.cookiesAccepted){
document.getElementById("cookieBox").style.display="block";
}
function acceptCookies(){
localStorage.cookiesAccepted="1";
document.getElementById("cookieBox").style.display="none";
}
</script>
</body>
</html>
